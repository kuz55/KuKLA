# Training only; same-origin HTTPS, no external assets or access logs.
server {
  listen 443 ssl;
  server_name _;
  ssl_certificate /etc/nginx/certs/server.crt;
  ssl_certificate_key /etc/nginx/certs/server.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  server_tokens off;
  access_log off;
  client_max_body_size 1m;
  add_header Cache-Control "no-store" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
  location /api/ {
    proxy_pass http://server:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }
  location = /ready { proxy_pass http://server:8080; }
  location ~ \.mjs$ { root /usr/share/nginx/html; default_type text/javascript; try_files $uri =404; }
  location / { root /usr/share/nginx/html; try_files $uri $uri/ =404; }
}
