limit_req_zone $binary_remote_addr zone=vk_auth:10m rate=20r/m;

server {
    listen 8080;
    server_name _;

    client_max_body_size 16k;

    # VK ID is registered with the domain root as its redirect URI.
    location = / {
        limit_except GET { deny all; }
        limit_req zone=vk_auth burst=10 nodelay;
        proxy_pass http://server:8080/api/v1/auth/vk/callback;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    location = /api/v1/auth/vk/start {
        limit_except POST OPTIONS { deny all; }
        limit_req zone=vk_auth burst=10 nodelay;
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    location = /api/v1/auth/vk/callback {
        limit_except GET { deny all; }
        limit_req zone=vk_auth burst=10 nodelay;
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    location = /api/v1/auth/vk/link/start {
        limit_except POST OPTIONS { deny all; }
        limit_req zone=vk_auth burst=5 nodelay;
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    location = /api/v1/auth/vk/poll {
        limit_except POST OPTIONS { deny all; }
        limit_req zone=vk_auth burst=20 nodelay;
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    location / {
        return 404;
    }
}

server {
    listen 8081;
    server_name _;
    client_max_body_size 1m;

    location / {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
