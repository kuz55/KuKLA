name: KuKLA CI

# push: ['**'] — пайплайн гоняется на любой ветке, включая feature/* и qa/*.
# Это нужно, чтобы каждую ветку плана видно было зелёной/красной до мержа в develop.
# pull_request оставлен только для main/develop: иначе на ветку с открытым PR
# приходилось бы по два запуска на каждый коммит (push + pull_request).
on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:
    branches: [main, develop]

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kukla
          POSTGRES_USER: kukla
          POSTGRES_PASSWORD: kukla
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kukla -d kukla"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run migrate
        env:
          DATABASE_URL: postgres://kukla:kukla@localhost:5432/kukla
      # Сначала проверяем строгий production-лимит отдельно, затем перезапускаем
      # сервер с увеличенным тестовым порогом для объёмных API-наборов с одного IP.
      - name: Start server for rate-limit test
        env:
          DATABASE_URL: postgres://kukla:kukla@localhost:5432/kukla
          JWT_SECRET: ci-only-secret-not-for-production
          PORT: '8080'
        run: nohup node dist/index.js > server.log 2>&1 & echo $! > server.pid
      - name: Wait for server
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/health > /dev/null; then
              echo "server is up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "server did not become ready in 30s" >&2
          exit 1
      - name: Test rate limit
        run: npm run test:rate-limit
        env:
          KUKLA_TEST_URL: http://127.0.0.1:8080
      - name: Restart server for integration tests
        env:
          DATABASE_URL: postgres://kukla:kukla@localhost:5432/kukla
          JWT_SECRET: ci-only-secret-not-for-production
          RATE_LIMIT_LOGIN_MAX: '100'
          PORT: '8080'
        run: |
          kill $(cat server.pid)
          nohup node dist/index.js > server.log 2>&1 & echo $! > server.pid
      - name: Wait for restarted server
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/health > /dev/null; then
              echo "server is up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "server did not become ready in 30s" >&2
          exit 1
      - run: npm test
        env:
          DATABASE_URL: postgres://kukla:kukla@localhost:5432/kukla
          KUKLA_TEST_URL: http://127.0.0.1:8080
      - name: Show server log
        if: failure()
        run: cat server.log

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
