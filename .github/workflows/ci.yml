name: KuKLA CI

# push: ['**'] — пайплайн гоняется на любой ветке, включая feature/* и qa/*.
# Это нужно, чтобы каждую ветку плана видно было зелёной/красной до мержа в develop.
# pull_request оставлен только для main/develop: иначе на ветку с открытым PR
# приходилось бы по два запуска на каждый коммит (push + pull_request).
on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:
    branches: [main, develop]

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kukla
          POSTGRES_USER: kukla
          POSTGRES_PASSWORD: kukla
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kukla -d kukla"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Test LAN certificate setup
        run: bash ../infrastructure/lan-test/test-init.sh
      - name: Validate isolated LAN Compose config
        run: docker compose -f ../infrastructure/lan-test/compose.yml config --quiet
        env:
          KUKLA_LAN_IP: 192.168.77.10
          POSTGRES_PASSWORD: test-only-value
          JWT_SECRET: test-only-value
      - name: Smoke-test disposable LAN stack
        run: bash ../infrastructure/lan-test/ci-smoke.sh
        env:
          KUKLA_DISPOSABLE_CI: '1'
      - run: npm run lint
      - run: npm run build
      - run: npm run migrate
        env:
          DATABASE_URL: postgres://kukla:kukla@localhost:5432/kukla
      # Сначала проверяем строгий production-лимит отдельно, затем перезапускаем
      # сервер с увеличенным тестовым порогом для объёмных API-наборов с одного IP.
      - name: Start server for rate-limit test
        env:
          DATABASE_URL: postgres://kukla:kukla@localhost:5432/kukla
          JWT_SECRET: ci-only-secret-not-for-production
          PORT: '8080'
        run: nohup node dist/index.js > server.log 2>&1 & echo $! > server.pid
      - name: Wait for server
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/health > /dev/null; then
              echo "server is up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "server did not become ready in 30s" >&2
          exit 1
      - name: Test rate limit
        run: npm run test:rate-limit
        env:
          KUKLA_TEST_URL: http://127.0.0.1:8080
      - name: Restart server for integration tests
        env:
          DATABASE_URL: postgres://kukla:kukla@localhost:5432/kukla
          JWT_SECRET: ci-only-secret-not-for-production
          RATE_LIMIT_LOGIN_MAX: '100'
          PORT: '8080'
        run: |
          kill $(cat server.pid)
          nohup node dist/index.js > server.log 2>&1 & echo $! > server.pid
      - name: Wait for restarted server
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/health > /dev/null; then
              echo "server is up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "server did not become ready in 30s" >&2
          exit 1
      - name: Run server tests
        run: |
          log="$RUNNER_TEMP/server-tests.log"
          if npm test > "$log" 2>&1; then
            cat "$log"
          else
            cat "$log"
            node test/ci-failure-summary.mjs "$log"
            exit 1
          fi
        env:
          DATABASE_URL: postgres://kukla:kukla@localhost:5432/kukla
          KUKLA_TEST_URL: http://127.0.0.1:8080
      - uses: actions/setup-go@v5
        with:
          go-version-file: rebuild/go.mod
          cache-dependency-path: rebuild/go.sum
      - name: Test desktop engine against disposable server
        working-directory: rebuild
        run: |
          log="$RUNNER_TEMP/remote-integration-test.log"
          if ! go test ./internal/httpapi -run '^TestRemoteSearchesRealServer$' -count=1 > "$log" 2>&1; then
            cat "$log"
            echo "::error title=Desktop server integration::$(tail -n 15 "$log" | tr '\n' ' ')"
            exit 1
          fi
          cat "$log"
        env:
          KUKLA_DISPOSABLE_INTEGRATION: '1'
      - name: Show server log
        if: failure()
        run: cat server.log

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  rebuild-go:
    name: Go engine (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rebuild
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: rebuild/go.mod
          cache-dependency-path: rebuild/go.sum
      - run: go test ./...
      - run: go vet ./...
      - name: Build engine for runner platform
        run: go build ./cmd/kukla-engine

  rebuild-ui-linux:
    name: GTK desktop UI (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK build dependencies
        # Fail explicitly if the Ubuntu package mirrors stall; do not leave an
        # otherwise completed CI run blocked indefinitely at dependency setup.
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 update
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 install --no-install-recommends -y build-essential make pkg-config libgtk-4-dev libjson-glib-dev
      - name: Test Windows packaging layout
        run: bash .github/scripts/test-package-windows.sh
      - name: Compile GTK client
        working-directory: rebuild
        run: make build-ui

  rebuild-ui-windows:
    name: GTK portable desktop package (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: rebuild/go.mod
          cache-dependency-path: rebuild/go.sum
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-json-glib
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-ntldd
      - name: Build desktop binaries
        working-directory: rebuild
        shell: pwsh
        run: go build -trimpath -ldflags='-s -w -H=windowsgui' -o build/kukla-engine.exe ./cmd/kukla-engine
      - name: Build GTK desktop UI
        working-directory: rebuild
        shell: msys2 {0}
        run: |
          set -o pipefail
          log="$(cygpath -u "$RUNNER_TEMP")/kukla-ui-build.log"
          if ! make UI_NAME=kukla-ui.exe UI_LDFLAGS=-mwindows build-ui 2>&1 | tee "$log"; then
            echo "::error title=Windows UI build failed::$(tail -n 12 "$log" | tr '\n' ' ')"
            exit 1
          fi
      - name: Bundle GTK runtime and create portable package
        working-directory: rebuild
        shell: msys2 {0}
        run: |
          set -o pipefail
          log="$(cygpath -u "$RUNNER_TEMP")/kukla-package.log"
          if ! bash ../.github/scripts/package-windows.sh 2>&1 | tee "$log"; then
            echo "::error title=Windows packaging failed::$(tail -n 12 "$log" | tr '\n' ' ')"
            exit 1
          fi
      - name: Create ZIP archive
        shell: pwsh
        working-directory: rebuild
        run: Compress-Archive -Path build/windows/KuKLA/* -DestinationPath build/KuKLA-windows-x64.zip -CompressionLevel Optimal
      - name: Smoke-test the extracted package without MSYS2 on PATH
        shell: pwsh
        working-directory: rebuild
        run: |
          try {
            & ../.github/scripts/test-windows-package.ps1 -PackageZip build/KuKLA-windows-x64.zip
          } catch {
            $detail = "$($_.Exception.Message) $($_.ScriptStackTrace)" -replace '[\r\n]+', ' '
            Write-Output "::error title=Windows package smoke test failed::$detail"
            throw
          }
      # Upload the directory, so the Actions download is one ZIP rather than a ZIP inside a ZIP.
      - uses: actions/upload-artifact@v4
        with:
          name: KuKLA-windows-x64
          path: rebuild/build/windows/KuKLA/
          if-no-files-found: error
          retention-days: 30
